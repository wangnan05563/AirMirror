org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# 2026-11-16：项目级缓存也收进 release/，让「删除 release/」成为唯一清理动作。
# .gradle 是 Gradle 的 project cache；Kotlin 的持久化目录在 build.gradle.kts 里
# 以绝对路径设置（Kotlin 2.0 对相对路径会生成不可创建的 session 路径）。
org.gradle.projectcachedir=release/.gradle
# 本机 Kotlin daemon 启动不稳定；in-process 避免 daemon 重试，保证打包链路可复现。
kotlin.compiler.execution.strategy=in-process
# 2026-11-15：按钮统一走开源 UI 库（Material Components / AppCompat），项目自此启用 AndroidX。
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
