# SonarQube 扫描配置（Android / Kotlin）
# 服务地址与令牌通过命令行参数或环境变量注入，不写入本文件。
sonar.projectKey=AirMirror
sonar.projectName=AirMirror
sonar.projectVersion=0.1.0-m0

sonar.sources=app/src/main/java
sonar.tests=app/src/test/java
sonar.sourceEncoding=UTF-8

# Kotlin 语义分析所需的编译产物（Gradle 编译后生成）
sonar.kotlin.binaries=app/build/tmp/kotlin-classes/debug
sonar.java.binaries=app/build/tmp/kotlin-classes/debug

# 排除构建产物与缓存目录
sonar.exclusions=**/build/**,**/.gradle/**,**/.kotlin/**
sonar.test.exclusions=**/build/**

# 关闭 SCM 责备信息采集（本地未配置 git blame 时可避免告警）
sonar.scm.disabled=true
